<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tirage au sort des contraintes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#FBF8FD;--ink:#3D3652;--muted:#7A7390;--line:#E7E0F0;--card:#FFFFFF;
  --c0:#FAD4DC;--c1:#CFEEDB;--c2:#FFF0BE;--c3:#CFE5F8;--c4:#DDD5F7;
  --s0:#E88FA3;--s1:#6FC49A;--s2:#E8C255;--s3:#6FAEE0;--s4:#A08FE0;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#231F2E;--ink:#EFEAFA;--muted:#B2AAC8;--line:#3A3450;--card:#2D2839;
  --c0:#5A3A47;--c1:#345242;--c2:#5C5230;--c3:#35506A;--c4:#4A4274;
}}
:root[data-theme="dark"]{
  --bg:#231F2E;--ink:#EFEAFA;--muted:#B2AAC8;--line:#3A3450;--card:#2D2839;
  --c0:#5A3A47;--c1:#345242;--c2:#5C5230;--c3:#35506A;--c4:#4A4274;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;line-height:1.5}
main{max-width:1040px;margin:0 auto;padding:32px 20px 48px}
h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:clamp(1.8rem,4vw,2.6rem);margin:0 0 6px;letter-spacing:-.01em}
.lead{margin:0 0 24px;color:var(--muted);max-width:60ch}
.main-btn{font:700 1.05rem 'Nunito',sans-serif;color:var(--ink);background:linear-gradient(90deg,var(--c0),var(--c2),var(--c1),var(--c3),var(--c4));border:2px solid var(--ink);border-radius:999px;padding:12px 28px;cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.main-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible{outline:3px solid var(--s4);outline-offset:3px}
.draws{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:28px 0 32px}
.draw{border-radius:22px;padding:14px 16px 12px;display:flex;flex-direction:column;gap:10px;min-height:170px}
.draw h2{margin:0;font-size:.9rem;font-weight:700;color:var(--muted)}
.draw p{margin:0;flex:1;font-family:'Fraunces',Georgia,serif;font-size:1.2rem;line-height:1.3}
.draw p.empty{font-family:'Nunito',sans-serif;font-size:.95rem;color:var(--muted)}
.draw.roll p{animation:pop .35s ease}
@keyframes pop{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}
.re{align-self:flex-start;font:600 .85rem 'Nunito',sans-serif;color:var(--ink);background:rgba(255,255,255,.55);border:1.5px solid var(--ink);border-radius:999px;padding:4px 14px;cursor:pointer}
.re:hover{background:rgba(255,255,255,.9)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .re{background:rgba(0,0,0,.25)}:root:not([data-theme="light"]) .re:hover{background:rgba(0,0,0,.45)}}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:20px;background:var(--card)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:760px}
th,td{text-align:left;padding:12px 14px;vertical-align:top;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:1rem}
td{font-size:.95rem;transition:background .25s}
td.on{font-weight:700;box-shadow:inset 0 0 0 2px var(--ink);border-radius:10px}
.cap{margin:10px 4px 0;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<main>
  <h1>Tirage au sort des contraintes</h1>
  <p class="lead">Tire un élément dans chaque colonne pour composer le point de départ d’une histoire. Tu peux aussi relancer une seule colonne.</p>
  <button class="main-btn" id="all">Tout tirer au sort</button>
  <section class="draws" id="draws" aria-live="polite"></section>
  <div class="tw"><table id="tbl"></table></div>
  <p class="cap">Les cases entourées dans le tableau correspondent au tirage en cours.</p>
</main>
<script>
const COLS=["Personnage","Lieu","Moment","Objet","Événement perturbateur"];
const ROWS=[
["Une collégienne timide","Le CDI du collège","Un mercredi pluvieux","Un livre sans titre","Une porte s’ouvre toute seule"],
["Un vieil horloger","Une ruelle de Nantes","À minuit","Une montre arrêtée","Les lumières s’éteignent d’un coup"],
["Un garçon rêveur","Un grenier poussiéreux","Pendant les vacances d’été","Un coffre fermé à clé","Une voix inconnue appelle son nom"],
["Un professeur étourdi","Une maison en ruine","Au lever du jour","Un stylo qui écrit avec une encre invisible","L’objet se met à briller"],
["Une reporter curieuse","Un port de pêche breton","Un soir de tempête","Une bouteille avec un message","Un inconnu apparaît et demande de l’aide"],
["Un chat errant","Une gare déserte","Le dernier jour de l’année","Une valise oubliée","Un message mystérieux est découvert"],
["Un jeune apprenti boulanger","Une forêt profonde","À la tombée de la nuit","Un vieux carnet de recettes","Le sol se met à trembler"],
["Une astronaute à la retraite","Un jardin potager","Un matin de brouillard","Une graine inconnue","Tout le monde disparaît, sauf le personnage"]
];
const pick=Array(COLS.length).fill(null);
const draws=document.getElementById('draws'), tbl=document.getElementById('tbl');

// Tableau
tbl.innerHTML='<thead><tr>'+COLS.map((c,i)=>`<th style="background:var(--c${i})">${c}</th>`).join('')+'</tr></thead><tbody>'+
  ROWS.map((r,ri)=>'<tr>'+r.map((v,ci)=>`<td data-r="${ri}" data-c="${ci}">${v}</td>`).join('')+'</tr>').join('')+'</tbody>';

// Cartes de tirage
draws.innerHTML=COLS.map((c,i)=>`<div class="draw" id="d${i}" style="background:var(--c${i})">
  <h2>${c}</h2><p class="empty">Pas encore tiré</p><button class="re" data-c="${i}">Relancer</button></div>`).join('');

function render(ci,animate){
  const card=document.getElementById('d'+ci), p=card.querySelector('p');
  p.className=''; p.textContent=ROWS[pick[ci]][ci];
  if(animate){card.classList.remove('roll');void card.offsetWidth;card.classList.add('roll');}
  tbl.querySelectorAll(`td[data-c="${ci}"]`).forEach(td=>{
    const on=+td.dataset.r===pick[ci];
    td.classList.toggle('on',on);
    td.style.background=on?`var(--c${ci})`:'';
  });
}
function draw(ci){
  let n;
  do{n=Math.floor(Math.random()*ROWS.length);}while(n===pick[ci]&&ROWS.length>1);
  pick[ci]=n; render(ci,true);
}
document.getElementById('all').onclick=()=>COLS.forEach((_,i)=>draw(i));
draws.addEventListener('click',e=>{const b=e.target.closest('.re');if(b)draw(+b.dataset.c);});
</script>
</body>
</html>
